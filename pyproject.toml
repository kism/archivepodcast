#:schema None
##:schema https://json.schemastore.org/pyproject.json

[project]
name = "archivepodcast"
version = "1.5.18"
description = "FastAPI webapp that will archive a podcast from a RSS feed. It will download the episodes and re-host them."
authors = [{ name = "Kieran Gee", email = "kieran.lost.the.game@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiobotocore>=2.25.2",
    "aiohttp>=3.13.3",
    "jinja2>=3.1,<4",
    "markdown>=3.10",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "rich>=15.0.0",
    "typed-ffmpeg-v7>=4.4",
    "anyio>=4.14.2",
]

[project.urls]
Repository = "https://github.com/kism/archivepodcast"
docs = "https://archivepodcast.readthedocs.io/"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.35"]

# Dev-only tooling: groups, not extras, so they never ship to PyPI as installable extras.
[dependency-groups]
type = [
    "ty",
    "types-Markdown",
    "botocore-stubs",
    "types-aiobotocore",
    "types-aiobotocore-s3",
    "aws_lambda_powertools",
]

lint = ["ruff"]

profile = ["aiomonitor"]

test = [
    "archivepodcast[web]",   # Tests exercise the FastAPI app
    "pytest>=9.1",
    "coverage==7.15.4",
    "pytest-cov",
    "pytest-mock",
    "pytest-random-order",
    "detect-test-pollution",
    "types-aiobotocore-s3",  # Mock uses typed dict
    "pytest-asyncio",
    "pytest-socket>=0.7.0",
    "httpx2",                # FastAPI
    "python-magic>=0.4",     # Tests verify downloaded/converted file content by magic bytes
]

docs = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

# Synced by default; `uv sync --all-extras` then gets tooling + the web extra.
dev = [
    { include-group = "type" },
    { include-group = "lint" },
    { include-group = "profile" },
    { include-group = "test" },
    { include-group = "docs" },
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
archivepodcast = "archivepodcast.__main__:main"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true
select = ["ALL"] # Include absolutely all of Ruff's rules.
ignore = [
    # Modules
    "DJ",  # Django not required
    "NPY", # Numpy not required
    "PD",  # Pandas not required
    "CPY", # Copyright not required, handled in pyproject.toml

    # Specific rules
    "missing-todo-author",                       # Verbose TODO, only I work on this project
    "missing-todo-link",                         # Verbose TODO, only I work on this project
    "suspicious-non-cryptographic-random-usage", # I'll assume no real crypto will be done.
    "single-line-implicit-string-concatenation", # conflict in the formatter
    "missing-trailing-comma",                    # conflict in the formatter
    "multiple-with-statements",                  # Honestly easier to read with thing and thing as with: with:
    "docstring-missing-returns",                 # Unrequired docstrings fine
    "docstring-missing-yields",                  # Unrequired docstrings fine
    "docstring-missing-exception",               # Unrequired docstrings fine
    "compare-to-empty-string",                   # I like comparing to empty strings
    "suspicious-xml-etree-import",               # stdlib etree import, feeds are trusted-ish and defusedxml is dead
    "suspicious-xml-element-tree-usage",         # stdlib etree parsing, same reasoning
]

[tool.ruff.lint.per-file-ignores]
"src/archivepodcast/config.py" = [
    "line-too-long", # Some long lines
]
"src/archivepodcast/lambda_handler.py" = [
    "any-type",                     # AWS Lambda handler signatures
    "unused-function-argument",     # AWS Lambda handler signatures
    "undocumented-public-function", # AWS Lambda handler signatures
    "hardcoded-temp-file",          # AWS Lambda needs /tmp usage
    "error-instead-of-exception",   # Logging in lambda a bit different
]
"tests/**/*.py" = [
    # Modules
    "ARG", # Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "D",   # Don't care about docstrings in tests
    "ANN", # Don't care about annotations in tests

    # Specific rules
    "assert",                                 # asserts allowed in tests.
    "private-member-access",                  # Accessing private members is needed for testing.
    "pytest-missing-fixture-name-underscore", # monkeypatch doesn't return.
    "hardcoded-password-string",              # Hardcoded fake passwords are fine in tests.
    "too-many-arguments",                     # Tests can have as many arguments as they want.
    "blind-except",                           # Tests can use BaseException.
    "magic-value-comparison",                 # Tests can have magic number comparisons.
    "import-private-name",                    # Importing private fine in tests
    "unused-async",                           # Unused async fine in tests
    "too-many-positional-arguments",          # Many positional arguments fine in tests
    "docstring-missing-yields",               # Unrequired docstrings fine
    "docstring-missing-returns",              # Unrequired docstrings fine
    "no-self-use",                            # Fakes/mocks must match instance method signatures
    "non-empty-init-module",                  # Shared test exception lives in __init__
]
"tests/fixtures/*.py" = [
    "pytest-fixture-autouse", # Global test setup (paths, thread errors, sleep) is what autouse is for

]
"tests/fixtures/aws.py" = [
    "invalid-argument-name", # AWS Just breaks the rules here
]
"docs/*.py" = [
    # Modules
    "INP",
    "D",
    "A",

    "hardcoded-password-func-arg", # Fake secrets
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 40

[tool.coverage.run]
command_line = ".venv/bin/pytest -q"
source = ["src/archivepodcast"]
context = "test"

[tool.pytest.ini_options]
addopts = ["--disable-socket", "--allow-hosts=127.0.0.1,127.0.1.1"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
show_missing = false
format = "text"
sort = "-Miss"

[tool.coverage.html]
show_contexts = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
