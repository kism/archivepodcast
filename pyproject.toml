#:schema None
##:schema https://json.schemastore.org/pyproject.json

[project]
name = "archivepodcast"
version = "1.5.15"
description = "FastAPI webapp that will archive a podcast from a RSS feed. It will download the episodes and re-host them."
authors = [{ name = "Kieran Gee", email = "kieran.lost.the.game@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiobotocore>=2.25.2",
    "aiohttp>=3.13.3",
    "jinja2>=3.1,<4",
    "markdown>=3.10",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "rich>=15.0.0",
    "typed-ffmpeg-v7>=4.3",
    "anyio>=4.14.2",
]

[project.urls]
Repository = "https://github.com/kism/archivepodcast"
docs = "https://archivepodcast.readthedocs.io/"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.35",
]

type = [
    "ty",
    "types-Markdown",
    "botocore-stubs",
    "types-aiobotocore",
    "types-aiobotocore-s3",
    "aws_lambda_powertools",
]

lint = ["ruff"]

profile = ["aiomonitor"]

test = [
    "archivepodcast[web]", # Tests exercise the FastAPI app
    "pytest>=9.1",
    "coverage==7.15.4",
    "pytest-cov",
    "pytest-mock",
    "pytest-random-order",
    "detect-test-pollution",
    "types-aiobotocore-s3",  # Mock uses typed dict
    "pytest-asyncio",
    "pytest-socket>=0.7.0",
    "httpx2",                # FastAPI
    "python-magic>=0.4",     # Tests verify downloaded/converted file content by magic bytes
]

docs = ["sphinx", "myst-parser", "sphinx-rtd-theme"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project.scripts]
archivepodcast = "archivepodcast.__main__:main"

[tool.ruff]
cache-dir = "~/.cache/ruff"
line-length = 120

[tool.ruff.lint]
extend-select = ["ANN", "PYI"]
preview = true
select = ["ALL"] # KG Include absolutely all of Ruff's rules.
ignore = [
    # Modules
    "DJ",  # KG Django not required
    "NPY", # KG Numpy not required
    "PD",  # KG Pandas not required
    "CPY", # KG Copyright not required, handled in pyproject.toml

    # Specific rules
    "missing-todo-author",   # KG Verbose TODO, only I work on this project
    "missing-todo-link",   # KG Verbose TODO, only I work on this project
    "suspicious-non-cryptographic-random-usage",    # KG I'll assume no real crypto will be done.
    "single-line-implicit-string-concatenation",  # KG conflict in the formatter
    "missing-trailing-comma",  # KG conflict in the formatter
    "multiple-with-statements",  # KG Honestly easier to read with thing and thing as with: with:
    "docstring-missing-returns",  # KG Unrequired docstrings fine
    "docstring-missing-yields",  # KG Unrequired docstrings fine
    "docstring-missing-exception",  # KG Unrequired docstrings fine
    "compare-to-empty-string", # KG I like comparing to empty strings
    "suspicious-xml-etree-import",    # KG stdlib etree import, feeds are trusted-ish and defusedxml is dead
    "suspicious-xml-element-tree-usage",    # KG stdlib etree parsing, same reasoning
]

[tool.ruff.lint.per-file-ignores]
"archivepodcast/config.py" = [
    "line-too-long", # KG Some long lines
]
"archivepodcast/lambda_handler.py" = [
    "any-type", # KG AWS Lambda handler signatures
    "unused-function-argument", # KG AWS Lambda handler signatures
    "undocumented-public-function",   # KG AWS Lambda handler signatures
    "hardcoded-temp-file",   # KG AWS Lambda needs /tmp usage
    "error-instead-of-exception", # KG Logging in lambda a bit different
]
"tests/**/*.py" = [
    # Modules
    "ARG", # KG Unused function args -> fixtures nevertheless are functionally relevant
    "FBT", # KG Don't care about booleans as positional arguments in tests, e.g. via @pytest.mark.parametrize()
    "D",   # KG Don't care about docstrings in tests
    "ANN", # KG Don't care about annotations in tests

    # Specific rules
    "assert",    # KG asserts allowed in tests.
    "private-member-access",  # KG Accessing private members is needed for testing.
    "pytest-missing-fixture-name-underscore",   # KG monkeypatch doesn't return.
    "hardcoded-password-string",    # KG Hardcoded fake passwords are fine in tests.
    "too-many-arguments", # KG Tests can have as many arguments as they want.
    "blind-except",  # KG Tests can use BaseException.
    "magic-value-comparison", # KG Tests can have magic number comparisons.
    "import-private-name", # KG Importing private fine in tests
    "unused-async",  # KG Unused async fine in tests
    "too-many-positional-arguments", # KG Many positional arguments fine in tests
    "docstring-missing-yields",  # KG Unrequired docstrings fine
    "docstring-missing-returns",  # KG Unrequired docstrings fine
    "no-self-use", # KG Fakes/mocks must match instance method signatures
    "non-empty-init-module",  # KG Shared test exception lives in __init__
]
"tests/fixtures/aws.py" = [
    "invalid-argument-name", # KG AWS Just breaks the rules here
]
"docs/*.py" = [
    # Modules
    "INP",
    "D",
    "A",

    "hardcoded-password-func-arg", # Fake secrets
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 40

[tool.coverage.run]
command_line = ".venv/bin/pytest -q"
source = ["archivepodcast"]
context = "test"

[tool.pytest.ini_options]
addopts = ["--disable-socket", "--allow-hosts=127.0.0.1,127.0.1.1"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
show_missing = false
format = "text"
sort = "-Miss"

[tool.coverage.html]
show_contexts = true

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
