---
name: Publish GHCR

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  MAIN_TAG: ghcr.io/${{ github.repository }}:latest
  MAIN_TAG_LOCAL: archivepodcast:latest
  DEB_VERSION: trixie
  DEB_TAG: ghcr.io/${{ github.repository }}:trixie
  LAMBDA_TAG: ghcr.io/${{ github.repository }}:lambda
  LAMBDA_TAG_LOCAL: archivepodcast:lambda
  PYTEST_TAG_LOCAL: archivepodcast:pytest
  FFMPEG_TAG_LOCAL: archivepodcast:ffmpeg
jobs:
  publish-ghcr:
    name: "Publish GitHub Container Registry"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            # PEP 440 pre/dev releases contain letters: 1.6.0rc1, 1.6.0b2, 1.6.0.dev1
            if [[ "$VERSION" =~ [a-z] ]]; then
              echo "stable=false" >> $GITHUB_OUTPUT
            else
              echo "stable=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "stable=false" >> $GITHUB_OUTPUT
          fi

      # Region Login
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # region ffmpeg
      - name: Build ffmpeg container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/_dep_ffmpeg.Dockerfile
          push: false
          load: true
          tags: ${{ env.FFMPEG_TAG_LOCAL }}

      # region build
      - name: Build main docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.MAIN_TAG_LOCAL }}
          file: ./docker/main.Dockerfile

      - name: Build lambda docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.LAMBDA_TAG_LOCAL }}
          file: ./docker/lambda.Dockerfile

      # region run
      - name: Create instance directory
        run: |
          mkdir -p instance
          chmod 777 instance

      - name: Run main docker
        run: docker run --rm --mount type=bind,source="$(pwd)"/instance,target=/app/instance --env AP_SELF_TEST=true ${{ env.MAIN_TAG_LOCAL }} archivepodcast

      - name: Healthcheck main docker
        run: bash scripts/check_docker_health.sh ${{ env.MAIN_TAG_LOCAL }}

      - name: Smoke test lambda docker
        run: |
          docker run -d --rm --name ap-lambda -p 9000:8080 ${{ env.LAMBDA_TAG_LOCAL }}
          sleep 3
          OUT=$(curl -s -XPOST localhost:9000/2015-03-31/functions/function/invocations -d '{}')
          docker stop ap-lambda
          echo "$OUT"
          # No instance is provided, so the handler must import fine and fail on the missing instance
          echo "$OUT" | grep -q "Instance path does not exist"

      - name: Remove instance directory
        run: sudo rm -rf instance

      # region test
      - name: Build pytest docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/pytest.Dockerfile
          push: false
          load: true
          tags: ${{ env.PYTEST_TAG_LOCAL }}

      - name: Run pytest docker
        run: docker run --rm ${{ env.PYTEST_TAG_LOCAL }}

      # region publish
      - name: Build and push main Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.version.outputs.has_version == 'true' }} # Manual runs only build and test
          tags: |
            ${{ steps.version.outputs.stable == 'true' && env.MAIN_TAG || '' }}
            ${{ steps.version.outputs.stable == 'true' && env.DEB_TAG || '' }}
            ${{ steps.version.outputs.has_version == 'true' && format('ghcr.io/{0}/archivepodcast:{1}-{2}', github.repository_owner, steps.version.outputs.version, env.DEB_VERSION) || '' }}
          file: ./docker/main.Dockerfile

      - name: Build and push lambda Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.version.outputs.has_version == 'true' }} # Manual runs only build and test
          provenance: false # Lambda rejects image indexes with attestations
          tags: |
            ${{ steps.version.outputs.stable == 'true' && env.LAMBDA_TAG || '' }}
            ${{ steps.version.outputs.has_version == 'true' && format('ghcr.io/{0}/archivepodcast:{1}-lambda', github.repository_owner, steps.version.outputs.version) || '' }}
          file: ./docker/lambda.Dockerfile
