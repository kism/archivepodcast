name: Check Docs

on:
  push:
    branches:
      - main
      - test
    paths-ignore: # README and docs are what this checks, so they aren't ignored
      - ".github/workflows/*publish*.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spellcheck: # run the action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: streetsidesoftware/cspell-action@v9
        with:
          incremental_files_only: false # Fine for small projects
          root: "."
          config: "cspell.json"

  check_md:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run markdownlint
        run: bunx markdownlint --ignore node_modules ./**/*.md
