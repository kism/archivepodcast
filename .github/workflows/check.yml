---
name: Lint

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"
      - "docs/**"
      - ".github/workflows/*publish*.yml"
      - ".github/workflows/*docker*.yml"
      - "scripts/**"
      - "docker/**"


jobs:
  check_py:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version-file: pyproject.toml

  check_js:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest
      - name: Run Biome
        run: biome ci

  check_html:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Get dependencies
        run: uv sync
      - name: Prepare to generate the HTML
        run: |
          mkdir -p instance/web/rss/
          cp -f scripts/config/rss-ci.rss instance/web/rss/test
          cp -f scripts/config/config-ci.json instance/config.json
      - name: Create fake ffmpeg
        run: |
          echo '#!/bin/bash' > /usr/local/bin/ffmpeg
          chmod +x /usr/local/bin/ffmpeg
      - name: Generate the HTML
        run: uv run python -m archivepodcast
        env:
          CI_SKIP_LFS_CHECK: "true" # Sure we can clone with lfs, but we can save a few cpu cycles.

      - name: Validate HTML
        run: bunx html-validate instance/web/*.html

  check_fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright's Chromium
        run: bunx playwright install --with-deps chromium
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Get dependencies
        run: uv sync --extra web
      - name: Prepare instance
        run: |
          mkdir -p instance/web/rss/
          cp -f scripts/config/rss-ci.rss instance/web/rss/test
          cp -f scripts/config/config-ci.json instance/config.json
      - name: Create fake ffmpeg
        run: |
          echo '#!/bin/bash' > /usr/local/bin/ffmpeg
          chmod +x /usr/local/bin/ffmpeg
      - name: Start the webserver
        run: uv run uvicorn --factory archivepodcast.run_webapp:create_app --port 5100 &
      - name: Wait for the webserver to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5100/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Webserver did not become ready in time" >&2
          exit 1
      - name: Check fonts load in a real browser
        run: bun scripts/check_fonts.mjs http://localhost:5100
