---
name: Test

on:
  push:
    branches:
      - main
      - test
    paths-ignore:
      - "**/README*"
      - "docs/**"
      - ".github/workflows/*publish*.yml"
      - ".github/workflows/*docker*.yml"
      - "scripts/**"
      - "docker/**"
      - ".cspell/**"

jobs:
  ffmpeg: # Static build from our Dockerfile, cached as a single entry, only rebuilt when the Dockerfile changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        id: cache
        with:
          path: ffmpeg-bin/ffmpeg
          key: ffmpeg-${{ hashFiles('docker/_dep_ffmpeg.Dockerfile') }}

      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build -f docker/_dep_ffmpeg.Dockerfile -t ffmpeg-build .
          id=$(docker create ffmpeg-build)
          mkdir -p ffmpeg-bin
          docker cp "$id":/build/ffmpeg/ffmpeg ffmpeg-bin/ffmpeg

      - name: Delete stale ffmpeg caches
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ffmpeg-${{ hashFiles('docker/_dep_ffmpeg.Dockerfile') }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key ffmpeg- --json id,key \
            -q '.[] | select(.key != env.KEEP) | .id' | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"

  pytest:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/cache/restore@v6
        with:
          path: ffmpeg-bin/ffmpeg
          key: ffmpeg-${{ hashFiles('docker/_dep_ffmpeg.Dockerfile') }}
          fail-on-cache-miss: true

      - name: Install ffmpeg
        run: sudo install -m755 ffmpeg-bin/ffmpeg /usr/local/bin/ffmpeg

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --no-default-groups --group test

      - name: Ensure that pytest isnt getting polluted by the default instance dir.
        run: |
          mkdir -p instance
          echo 'ensuring that this never gets touched by pytest' > instance/config.json
          chmod 000 instance/config.json

      - name: Test with pytest, get coverage
        run: |
          .venv/bin/coverage run
          .venv/bin/coverage report
          .venv/bin/coverage xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
